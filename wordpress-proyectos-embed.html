<!-- Pegá este bloque en un elemento Code de Bricks dentro de la página /proyectos/. -->
<!-- El header y footer globales de Productos Integra quedan fuera del iframe y se conservan intactos. -->
<style>
  .integra-proyectos-embed{background:#f8f8f5;line-height:0;overflow:hidden}
  .integra-proyectos-embed__frame{display:block;width:100%;height:1500px;border:0;background:#f8f8f5;transition:height .2s ease}
</style>
<section class="integra-proyectos-embed" aria-label="Proyectos Integra">
  <iframe
    class="integra-proyectos-embed__frame"
    title="Proyectos Integra"
    src="https://fbphoenix7.github.io/proyectos-integra/?embed=1"
    loading="eager"
    scrolling="no"
  ></iframe>
</section>
<script>
  (function(){
    var frame=document.querySelector('.integra-proyectos-embed__frame');
    if(!frame)return;
    window.addEventListener('message',function(event){
      if(event.origin!=='https://fbphoenix7.github.io'||!event.data||event.data.source!=='integra-proyectos')return;
      var height=Math.max(800,Math.ceil(Number(event.data.height)||0));
      if(height)frame.style.height=height+'px';
    });
  }());
</script>
